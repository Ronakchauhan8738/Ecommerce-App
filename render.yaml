services:
  # Backend API
  - type: web
    name: ecommerce-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5001
      - key: SKIP_SEED_ON_START
        value: "false"

  # Frontend Static Site
  - type: web
    name: ecommerce-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false # Will point to the backend URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
